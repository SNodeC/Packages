name: Publish packages
run-name: publish ${{ inputs.publication_id }}/${{ inputs.attempt }}
on:
  workflow_dispatch:
    inputs:
      publication_id:
        description: Frozen publication plan
        required: true
      attempt:
        description: Publication attempt
        required: true
      feed_branch:
        description: Destination feed
        required: true
        type: choice
        options: [feed, feed-staging]
      fault:
        description: Staging interruption test
        type: choice
        options: [none, after_push]
        default: none
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-${{ inputs.feed_branch }}
  cancel-in-progress: false
env:
  CORECI_ORIGIN: ${{ vars.CORECI_ORIGIN }}
  REQUEST_ID: ${{ inputs.publication_id }}
  ATTEMPT: ${{ inputs.attempt }}
  FEED_BRANCH: ${{ inputs.feed_branch }}
  FAULT: ${{ inputs.fault }}
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: publish
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: claim
        env:
          CORECI_CALLBACK_SECRET: ${{ secrets.CORECI_CALLBACK_SECRET }}
        run: python3 tools/common.py claim publications
      - if: steps.claim.outputs.accepted == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c zstd
      - if: steps.claim.outputs.accepted == 'true'
        env:
          CORECI_CALLBACK_SECRET: ${{ secrets.CORECI_CALLBACK_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
          OPENWRT_USIGN_PRIVATE_KEY: ${{ secrets.OPENWRT_USIGN_PRIVATE_KEY }}
          OPENWRT_APK_PRIVATE_KEY: ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
        run: python3 tools/publish.py
