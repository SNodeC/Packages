name: Package wave
on:
  workflow_dispatch:
    inputs:
      wave_id:
        description: Wave identity
        required: true
      plan_url:
        description: Public JSON plan URL
      plan_json:
        description: Base64 JSON plan for manual runs
      callback_url:
        description: Wave report endpoint; empty disables callbacks
      feed_branch:
        description: Destination feed
        type: choice
        options: [feed, feed-staging]
        default: feed
        required: true
permissions:
  contents: read
concurrency:
  group: wave-${{ inputs.feed_branch }}
  cancel-in-progress: false
env:
  WAVE_ID: ${{ inputs.wave_id }}
  CALLBACK_URL: ${{ inputs.callback_url }}
  FEED_BRANCH: ${{ inputs.feed_branch }}
  PLAN_URL: ${{ inputs.plan_url }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PLAN_JSON: ${{ inputs.plan_json }}
          CORECI_CALLBACK_SECRET: ${{ secrets.CORECI_CALLBACK_SECRET }}
        run: python3 tools/plan.py
  chain:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: chain (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: chain
        env:
          CORECI_CALLBACK_SECRET: ${{ secrets.CORECI_CALLBACK_SECRET }}
        run: python3 tools/chain.py
      - id: upload
        if: ${{ always() && steps.chain.outputs.packages == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coreci-${{ inputs.wave_id }}-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}
      - if: always()
        env:
          CORECI_CALLBACK_SECRET: ${{ secrets.CORECI_CALLBACK_SECRET }}
          ARTIFACT: ${{ steps.upload.outputs.artifact-id && format('coreci-{0}-{1}', inputs.wave_id, matrix.id) || '' }}
        run: python3 tools/common.py
  report:
    needs: [plan, chain]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - if: always()
        env:
          CORECI_CALLBACK_SECRET: ${{ secrets.CORECI_CALLBACK_SECRET }}
          CONCLUSION: ${{ needs.plan.result == 'success' && needs.chain.result == 'success' && 'success' || 'failure' }}
        run: python3 tools/common.py
